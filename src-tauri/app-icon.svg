<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底 -->
  <rect x="64" y="64" width="896" height="896" rx="192" ry="192" fill="url(#bg)"/>

  <!-- 对话气泡 -->
  <g transform="translate(512,480)">
    <!-- 气泡主体 -->
    <rect x="-280" y="-220" width="560" height="360" rx="60" ry="60" fill="white" opacity="0.95"/>
    <!-- 气泡尖角 -->
    <polygon points="-60,140 -20,200 20,140" fill="white" opacity="0.95"/>

    <!-- 三条横线代表文字 -->
    <rect x="-200" y="-120" width="400" height="28" rx="14" fill="#93C5FD"/>
    <rect x="-200" y="-72" width="300" height="28" rx="14" fill="#93C5FD"/>
    <rect x="-200" y="-24" width="340" height="28" rx="14" fill="#BFDBFE"/>

    <!-- AI 字样 -->
    <text x="0" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="72" fill="#3B82F6">AI</text>
  </g>

  <!-- 四角光点 -->
  <circle cx="200" cy="200" r="16" fill="white" opacity="0.3"/>
  <circle cx="824" cy="180" r="12" fill="white" opacity="0.2"/>
  <circle cx="180" cy="780" r="10" fill="white" opacity="0.2"/>
</svg>